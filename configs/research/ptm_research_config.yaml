# 冻结研究设计（阶段 0，方案 §7 / 指南 §1）
#
# AD 侧字段（contrast、reference_axis、objective、pairing、donor/FDR 阈值、
# cell_types、cohort_h5ad）基于 GSE174367 真实队列冻结；方向语义按方案 §3.1
# 分字段记录，禁止全局同号/取反。
#
# PTM 侧资产绑定（2026-09-21 起，TD-07）：network_release 升级为 combined
# kinase+TF release `omnipath-kinase+tf-2026-09-21`（kinase_substrate:signaling
# 15,133 边 + tf_regulation 12,878 边，共 28,011 行；由
# data/manifests/kstar_signed_network_release_20260921.json 登记 sha256/行数，
# 传播 CLI 启动时执行 verify_network_release_binding 校验）。旧 TF-only
# `omnipath-2026-09-16` 文件未改动、未删除；在此绑定变更前生成的 score 与
# 新 release 结果不得混用。
# ptm_cohort（真实 PTM 定量队列）与 KSTAR/PhosR activity 仍为外部输入：
# mode 保持 exploratory（formal 模式会拒绝 PENDING_* sentinel）；exploratory
# 运行不得产出正式 PTM score 或进入正式 lineage。
schema_version: ptm2cellnet.ptm-research-config/v1
research_objective: association
reference_axis: disease_minus_normal
contrast: "disease-minus-normal"
primary_activity_method: KSTAR
sensitivity_activity_method: PhosR
network_release: "omnipath-kinase+tf-2026-09-21"
network_release_manifest: data/manifests/kstar_signed_network_release_20260921.json
cell_types: [EX, INH]
cohort_h5ad: /home/scu/PTM2CellNet/data/AD/standardized/GSE174367_ad_cohort.h5ad
cohort_pairing: between_donor
species: "9606"
ptm_cohort: PENDING_EXTERNAL_PTM_COHORT
mode: exploratory
deg_max_fdr: 0.05
# 2026-09-18：observed 准入改为 signed disease−normal 方向一致；deg_max_fdr
# 仍是 BH 报告阈值，不得把 FDR>0.05 改标成显著。KD 并入 KO（本 AD 候选只做
# loss-of-function KO）。公共 Perturb-seq / B1 转移不再检索。
observed_admission_rule: signed_direction_without_fdr_cutoff
kd_policy: merged_into_ko_out_of_scope
public_perturbation_policy: out_of_scope
min_donors_per_state: 3
# DEG estimand（2026-09-16 冻结，方案 §7.4-U4 方案 A）：donor pseudobulk
# counts 先聚合再归一化。此前 per_cell_log2_mean 口径（每细胞 log2(CPM+1)
# 再 donor 平均）在 GSE174367 全队列 117,352 行中最小 FDR 仅 0.0855，observed
# 三方 gate 数学上不可通过；本冻结为研究口径变更，新表与旧表不得混用，
# 旧表（20260915_d0）作废。
deg_donor_aggregation: pseudobulk_counts
replicate_policy: mean
# Activity 传播准入（2026-09-21 登记冻结，TD-02/方案 §4.4/§5.2）：当前无独立
# kinase-perturbation benchmark 校准，登记为宽松阈值（等于不做 q/coverage 过滤），
# PTM 侧保持 direction_only；阈值一经冻结不得在 AD 结果上事后收紧/放宽
# （方案 §8.7）。研究负责人校准 benchmark 后须显式修订本段。
activity_admission:
  max_activity_qvalue: 1.0
  min_substrates: 0
  min_network_coverage: 0.0
# 独立 kinase-perturbation benchmark 判据（方案 §5.2 第 4–5 条，U-01）。
# benchmark 数据到位并预注册后取消注释（阈值由研究负责人显式登记，方案
# §8.7 不得事后挑选）；未注册时 benchmark_gate.available=false，admitted
# activity 只有 exploratory 效力，传播 CLI 拒绝 --activity-benchmark。
# activity_benchmark:
#   min_paired_regulators: 5
#   min_direction_concordance: 0.7
#   min_abs_spearman: 0.3
#   bootstrap_iterations: 2000
#   ci_level: 0.95
#   seed: 0
propagation:
  max_depth: 3
  decay: 0.5
  # 2026-09-21：kinase activity 主线要求 kinase→substrate 边终止于基因
  # （TD-07 绑定 combined release 后新增 gene-terminating edge type）。
  gene_edge_types: [tf_regulation, "kinase_substrate:signaling"]
  max_paths_per_seed: null
semantic_context:
  context: "GSE174367 {cell_type} cells"
  intervention: "KO"
  comparison_baseline: "donor-level disease vs normal"
  reference_axis: "disease_minus_normal"
  research_objective: association
  evidence_source: "PTM activity network concordance + donor DEG"
  cohort: "GSE174367"
