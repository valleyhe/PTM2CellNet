# 冻结研究设计（阶段 0，方案 §7 / 指南 §1）
#
# AD 侧字段（contrast、reference_axis、objective、pairing、donor/FDR 阈值、
# cell_types、cohort_h5ad）基于 GSE174367 真实队列冻结；方向语义按方案 §3.1
# 分字段记录，禁止全局同号/取反。
#
# PTM 侧资产绑定：network_release 已于 2026-09-16 从 OmniPath REST 导出组装
# （datasets=dorothea,tf_target、dorothea_levels=A..E；12,878 条 signed TF→gene
# 边；data/processed/signed_network/signed_network_omnipath_20260916.tsv + manifest）。
# ptm_cohort（真实 PTM 定量队列）与 KSTAR/PhosR activity 仍为外部输入：在
# ptm_cohort PENDING 状态下运行阶段 1–2 仍视为契约违规，不得产出正式 PTM score。
schema_version: ptm2cellnet.ptm-research-config/v1
research_objective: association
reference_axis: disease_minus_normal
contrast: "disease-minus-normal"
primary_activity_method: KSTAR
sensitivity_activity_method: PhosR
# PTM 侧资产绑定：signed network 已于 2026-09-16 从 OmniPath REST 导出组装
# （datasets=dorothea,tf_target、dorothea_levels=A..E；12,878 条 signed TF→gene
# 边；data/processed/signed_network/signed_network_omnipath_20260916.tsv + manifest）。
# ptm_cohort（真实 PTM 定量队列）与 KSTAR/PhosR activity 仍为外部输入：在
# ptm_cohort PENDING 状态下运行阶段 1–2 仍视为契约违规，不得产出正式 PTM score。
network_release: "omnipath-2026-09-16"
cell_types: [EX, INH]
cohort_h5ad: /home/scu/PTM2CellNet/data/AD/standardized/GSE174367_ad_cohort.h5ad
cohort_pairing: between_donor
species: "9606"
ptm_cohort: PENDING_EXTERNAL_PTM_COHORT
deg_max_fdr: 0.05
# 2026-09-18：observed 准入改为 signed disease−normal 方向一致；deg_max_fdr
# 仍是 BH 报告阈值，不得把 FDR>0.05 改标成显著。KD 并入 KO（本 AD 候选只做
# loss-of-function KO）。公共 Perturb-seq / B1 转移不再检索。
observed_admission_rule: signed_direction_without_fdr_cutoff
kd_policy: merged_into_ko_out_of_scope
public_perturbation_policy: out_of_scope
min_donors_per_state: 3
# DEG estimand（2026-09-16 冻结，方案 §7.4-U4 方案 A）：donor pseudobulk
# counts 先聚合再归一化。此前 per_cell_log2_mean 口径（每细胞 log2(CPM+1)
# 再 donor 平均）在 GSE174367 全队列 117,352 行中最小 FDR 仅 0.0855，observed
# 三方 gate 数学上不可通过；本冻结为研究口径变更，新表与旧表不得混用，
# 旧表（20260915_d0）作废。
deg_donor_aggregation: pseudobulk_counts
replicate_policy: mean
propagation:
  max_depth: 3
  decay: 0.5
  gene_edge_types: [tf_regulation]
  max_paths_per_seed: null
semantic_context:
  context: "GSE174367 {cell_type} cells"
  intervention: "KO"
  comparison_baseline: "donor-level disease vs normal"
  reference_axis: "disease_minus_normal"
  research_objective: association
  evidence_source: "PTM activity network concordance + donor DEG"
  cohort: "GSE174367"
