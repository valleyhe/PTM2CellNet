# ESM-2 8M 预训练模型配置
# 使用ESM-2 8M模型作为序列编码器（最小版本）

model:
  encoder_type: "esm2_8M"
  freeze_encoder: false
  num_classes: 2
  dropout: 0.1
  pretrained_cache_dir: null

training:
  max_epochs: 50
  batch_size: 32
  learning_rate: 1.0e-4
  weight_decay: 0.01
  optimizer: "adamw"
  scheduler: "cosine"

  accelerator: "gpu"
  devices: 1
  precision: "16-mixed"
  accumulate_grad_batches: 1

  early_stopping:
    enabled: true
    patience: 5
    monitor: "val_loss"
    mode: "min"

  checkpoint:
    enabled: true
    save_top_k: 3
    monitor: "val_loss"
    mode: "min"

  logger:
    type: "tensorboard"
    save_dir: "outputs/logs"
    name: "esm2_8m"

data:
  max_sequence_length: 1024
  num_workers: 4
  pin_memory: true
  valid_amino_acids: "ACDEFGHIKLMNPQRSTVWY"
  ptm_types:
    - "phosphorylation"
    - "acetylation"
    - "methylation"
    - "ubiquitination"
    - "sumoylation"

paths:
  outputs_root: "outputs"
  outputs_models: "outputs/models/esm2_8m"