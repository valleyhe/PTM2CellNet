# Opt-in cross-scale model contract.  The smoke configuration uses precomputed
# embeddings in tests; it does not download Ankh39/ESM-2/ProtT5 weights.
cross_scale:
  model_version: cross-scale-v1
  protein_dim: 16
  signal_input_dim: 16
  signal_hidden_dim: 16
  signal_output_dim: 16
  cell_gene_feature_dim: 8
  cell_hidden_dim: 16
  num_cell_genes: 12
  num_cell_states: 3
  num_ptm_types: 4
  max_position: 64
  signal_layers: 2
  propagation_alpha: 0.85
  max_sensitivity_nodes: 2048
  dropout: 0.0
  plm_backbone_dims:
    ankh39: 11
    esm2: 13
    prott5: 17
  plm_model_names:
    ankh39: data/weights/plm/ankh-base
    esm2: data/weights/plm/esm2_t30_150M_UR50D
    prott5: data/weights/plm/prot_t5_xl_half_uniref50-enc
  required_backbones: [ankh39, esm2, prott5]
  freeze_plm_backbones: true
  allow_plm_fallback: false
  allow_graph_approximation: false
  require_signal_gene_map: true
  data_manifest: data/manifests/datasets.yaml
  signal_graph_version: fixture-v1
  plm_asset_root: data/weights/plm
  plm_local_dirs:
    ankh39: ankh-base
    esm2: esm2_t30_150M_UR50D
    prott5: prot_t5_xl_half_uniref50-enc

training:
  batch_size: 4
  num_workers: 0
  max_epochs: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  accumulation_steps: 1
  mixed_precision: false
  device: cpu
  lr_factor: 0.5
  lr_patience: 2
  early_stopping_patience: 5

labels:
  cell_states: [state_0, state_1, state_2]
