# DAVF Integration Configuration (schema v2)
# Used by PTM2CellNet when use_davf=True
# Historical feature-path defaults only; this file does not certify the
# checkpoint below as compatible with the current scVI latent model. Use
# configs/davf_current.yaml plus a schema_version=2 checkpoint for formal
# direction evidence.
# See src/models/davf_inference.py for DAVFInferenceConfig documentation
#
# Schema v2 (2026-08-23): removed `geneformer_path` and its null→random
# embedding fallback. Gene embeddings come from a verified PerturbGen
# embedding asset directory (exported by scripts/export_perturbgen_gene_embeddings.py)
# via `embedding_asset_path`. Old configs containing `geneformer_path` are
# rejected with an explicit migration error at load time.

davf:
  state_space: "scvi_latent"
  checkpoint_path: "checkpoints/latent_davf_ibd_norman/best_model.pt"
  # scvi_model_path must be provided for formal DAVF direction evidence.
  # null keeps the historical feature-only path; it is not a valid scVI
  # direction configuration.
  scvi_model_path: null
  # PerturbGen embedding asset directory (manifest.json + vocabulary.json +
  # gene_embeddings.safetensors). When set, the frozen matrix is injected into
  # LatentDAVF; missing/corrupt assets fail fast. null = train-from-scratch
  # embedding table (requires a matching checkpoint).
  embedding_asset_path: null
  gene_names_path: null
  feature_dim: 128
  hidden_dim: 256
  latent_dim: 10
  num_genes: 5000
  num_steps: 50
  freeze: true
  device: null

ptm_mapper:
  max_targets: 32

integration:
  concat_point: "before_predictor"
  zero_features_on_missing_checkpoint: true
  zero_features_on_empty_ptm: true
