# Mamba编码器配置 (Large)
# 适用于大规模数据集和追求极致性能

model:
  encoder_type: "mamba"
  hidden_dim: 1024
  num_layers: 24
  state_dim: 32
  num_classes: 4
  num_ptm_types: 10
  dropout: 0.1
  vocab_size: 21  # 20 amino acids + 1 padding token

data:
  max_sequence_length: 1000
  batch_size: 16
  num_workers: 4
  valid_amino_acids: "ACDEFGHIKLMNPQRSTVWY"
  ptm_types:
    - "Phosphorylation"
    - "Acetylation"
    - "Ubiquitination"
    - "Methylation"
    - "Glycosylation"
    - "SUMOylation"
    - "Palmitoylation"
    - "Nitrosylation"
    - "Hydroxylation"
    - "ADP-ribosylation"

training:
  max_epochs: 100
  learning_rate: 5.0e-5
  optimizer: "adamw"
  weight_decay: 0.01
  scheduler: "cosine"
  warmup_epochs: 10

  gradient_clip_val: 1.0
  accumulate_grad_batches: 4
  precision: "bf16-mixed"

  accelerator: "gpu"
  devices: 1
  strategy: "auto"

callbacks:
  model_checkpoint:
    monitor: "val_loss"
    mode: "min"
    save_top_k: 3
    filename: "mamba-large-{epoch:02d}-{val_loss:.4f}"

  early_stopping:
    monitor: "val_loss"
    patience: 15
    mode: "min"

  learning_rate_monitor:
    logging_interval: "step"
