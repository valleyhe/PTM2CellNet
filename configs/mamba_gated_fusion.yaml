# Mamba编码器配置 + Gated PTM Fusion
# 使用门控融合机制替代Cross-Attention

model:
  encoder_type: "mamba"
  hidden_dim: 128
  num_layers: 4
  state_dim: 8              # 最优state_dim
  num_classes: 4
  num_ptm_types: 10
  dropout: 0.2              # 增加正则化
  vocab_size: 21
  ptm_fusion_type: "gated"  # 使用门控融合

data:
  max_sequence_length: 500
  batch_size: 16
  num_workers: 4
  valid_amino_acids: "ACDEFGHIKLMNPQRSTVWY"
  ptm_types:
    - "Phosphorylation"
    - "Acetylation"
    - "Ubiquitination"
    - "Methylation"
    - "Glycosylation"
    - "SUMOylation"
    - "Palmitoylation"
    - "Nitrosylation"
    - "Hydroxylation"
    - "ADP-ribosylation"

training:
  max_epochs: 50
  learning_rate: 0.0002
  optimizer: "adamw"
  weight_decay: 0.01
  scheduler: "cosine"
  warmup_epochs: 5

  gradient_clip_val: 1.0
  accumulate_grad_batches: 4
  precision: "16-mixed"

  accelerator: "gpu"
  devices: 1
  strategy: "auto"

callbacks:
  model_checkpoint:
    monitor: "val_loss"
    mode: "min"
    save_top_k: 3
    filename: "mamba-gated-{epoch:02d}-{val_loss:.4f}"

  early_stopping:
    monitor: "val_loss"
    patience: 15
    mode: "min"

  learning_rate_monitor:
    logging_interval: "step"
