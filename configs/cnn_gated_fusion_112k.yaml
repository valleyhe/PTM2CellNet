# CNN + Gated Fusion config for 112k dataset

model:
  encoder_type: "cnn"
  hidden_dim: 256
  num_layers: 4
  num_classes: 2
  num_ptm_types: 10
  dropout: 0.2
  vocab_size: 21
  ptm_fusion_type: "gated"

data:
  max_sequence_length: 500
  batch_size: 256
  num_workers: 8
  persistent_workers: true
  pin_memory: true
  valid_amino_acids: "ACDEFGHIKLMNPQRSTVWY"
  ptm_types:
    - "Phosphorylation"
    - "Acetylation"
    - "Ubiquitination"
    - "Methylation"
    - "Glycosylation"
    - "SUMOylation"
    - "Palmitoylation"
    - "Nitrosylation"
    - "Hydroxylation"
    - "ADP-ribosylation"

training:
  max_epochs: 30
  learning_rate: 0.0002
  optimizer: "adamw"
  weight_decay: 0.01
  scheduler: "cosine"
  warmup_epochs: 3

  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  precision: "16-mixed"

  accelerator: "gpu"
  devices: 1
  strategy: "auto"

callbacks:
  model_checkpoint:
    monitor: "val_loss"
    mode: "min"
    save_top_k: 3
    filename: "cnn-gated-{epoch:02d}-{val_loss:.4f}"

  early_stopping:
    monitor: "val_loss"
    patience: 10
    mode: "min"

  learning_rate_monitor:
    logging_interval: "step"
