# Mamba编码器配置 (Small) - GPU优化版
# 适用于GPU训练，减小batch_size避免OOM

model:
  encoder_type: "mamba"
  hidden_dim: 256
  num_layers: 6
  state_dim: 16
  num_classes: 4
  num_ptm_types: 10
  dropout: 0.1
  vocab_size: 21  # 20 amino acids + 1 padding token

data:
  max_sequence_length: 500  # 减小序列长度
  batch_size: 16            # 减小batch_size避免OOM
  num_workers: 4
  valid_amino_acids: "ACDEFGHIKLMNPQRSTVWY"
  ptm_types:
    - "Phosphorylation"
    - "Acetylation"
    - "Ubiquitination"
    - "Methylation"
    - "Glycosylation"
    - "SUMOylation"
    - "Palmitoylation"
    - "Nitrosylation"
    - "Hydroxylation"
    - "ADP-ribosylation"

training:
  max_epochs: 100
  learning_rate: 0.0002
  optimizer: "adamw"
  weight_decay: 0.01
  scheduler: "cosine"
  warmup_epochs: 5

  gradient_clip_val: 1.0
  accumulate_grad_batches: 4  # 增加梯度累积保持有效batch_size
  precision: "16-mixed"       # 使用混合精度节省内存

  accelerator: "gpu"
  devices: 1
  strategy: "auto"

callbacks:
  model_checkpoint:
    monitor: "val_loss"
    mode: "min"
    save_top_k: 3
    filename: "mamba-small-{epoch:02d}-{val_loss:.4f}"

  early_stopping:
    monitor: "val_loss"
    patience: 10
    mode: "min"

  learning_rate_monitor:
    logging_interval: "step"
