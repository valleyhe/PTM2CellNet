manifest_version: 1.0.0
schema_version: ptm2cellnet.data-manifest.v1
project: PTM2CellNet
generated_at: '2026-08-08'
owner: PTM2CellNet data working group
canonical_contract:
  required_columns:
  - sequence
  - ptm_sites
  - cell_state
  provenance_columns:
  - protein_accession
  - gene_symbol
  - source_db
  - evidence_level
  - split_group
  position_semantics: 1-based residue positions
  checksum: sha256
# P1-04: 研究 profile 激活清单。profile 中 required_datasets 缺失、路径为空、
# 哈希漂移或 schema 不合格时，`validate_data_manifest.py --profile <name> --strict`
# 必须 fail-fast（见 docs/E2E训练与推理现状分析_2026-08-08.md 阶段 A）。
profiles:
  standard_training:
    description: Standard PTM2CellNet training release (sequence + PTM supervision)
    required_datasets:
    - pmads
    optional_datasets:
    - uniprotkb
    - phosphositeplus
    - dbptm
    - cplm
  cross_scale_training:
    description: Cross-scale training release (perturbation targets + signaling graphs)
    required_datasets:
    - pmads
    - scperturb
    - norman_adamson
    - replogle
    - scgenescope
    - kinase_substrate
    - string
    - bioplex
    - regnetwork
    optional_datasets: []
  cross_scale_inference:
    description: Cross-scale inference release (graphs + gene vocabularies only)
    required_datasets:
    - scgenescope
    - kinase_substrate
    - string
    - bioplex
    - regnetwork
    optional_datasets:
    - pmads
datasets:
- id: uniprotkb
  name: UniProtKB human protein sequences
  category: protein_sequence
  status: implemented
  source:
    provider: UniProt Consortium
    homepage: https://www.uniprot.org/
    reference: UniProtKB REST/API or reviewed local FASTA release
    access: public_api_or_user_snapshot
    license: UniProt license and release terms must be recorded for each snapshot
  formats:
  - fasta
  - json
  - tsv
  loader: src.data.loaders.uniprot_loader.UniProtLoaderMixin
  files:
  - path: null
    format: fasta
    required: false
    sha256: null
  canonical_schema:
    required_columns:
    - protein_accession
    - sequence
    optional_columns:
    - gene_symbol
    - organism
    - length
    - release
  quality_requirements:
    min_rows: 1
    checks:
    - unique_accession
    - standard_amino_acids
    - non_empty_sequence
    - release_recorded
  preprocessing:
    version: 1.0.0
    entrypoint: src.data.loaders.uniprot_loader
