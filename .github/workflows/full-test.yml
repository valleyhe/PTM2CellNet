name: Full Test Suite

on:
  workflow_dispatch:
  schedule:
    # TD-M04: 完整测试项数随套件增长，耗时较长，按 nightly 自动运行；
    # 也可在 PR 手动触发（workflow_dispatch）做全量回归。
    - cron: "30 2 * * *"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/**"

jobs:
  full-test:
    name: All Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout pytest-cov

      - name: Verify dependency consistency (pip check)
        # TD-M05: 全量环境存在已知取舍（scgpt 要求 scvi-tools<1.0，与
        # scvi-tools>=1.2.0 冲突；ssh-unit 要求 torchaudio>=2.5）。此步骤
        # 仅报告不阻断，避免 CI 因可选包约束互相冲突而持续红色。
        run: |
          python -m pip check || echo "KNOWN_DEPENDENCY_CONFLICTS=1" >> $GITHUB_ENV

      - name: Run all tests (skip GPU, include slow)
        env:
          HF_ENDPOINT: https://hf-mirror.com
          TRANSFORMERS_CACHE: /tmp/hf_cache
        run: >-
          pytest -m "not gpu"
          --timeout=300
          --cov=src
          --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml
          --cov-fail-under=74

      - name: Run mypy
        run: |
          pip install mypy
          mypy src/
