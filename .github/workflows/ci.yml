name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Core Tests and Coverage
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install -r requirements-dev.txt

      - name: Run core tests with branch coverage gate
        run: >-
          pytest tests/unit/ tests/integration/ tests/test_*.py
          -m "not slow and not gpu"
          --timeout=300
          --cov=src
          --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml
          --cov-fail-under=74

  analysis:
    name: Analysis and PerturbGen Contract Tests
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements-analysis.txt

      - name: Run analysis and PerturbGen unit tests
        run: >-
          pytest
          tests/unit/integration/perturbgen/
          tests/integration/test_perturbgen_pipeline_mocked.py
          -m "not slow and not gpu and not real_assets"
          --timeout=300

  dependencies:
    name: Dependency Consistency (pip check + lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install core dependencies and project metadata
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: pip check (installed metadata must be conflict-free)
        run: pip check

      - name: Requirements vs lock pin consistency (TD-N-32/34)
        run: python scripts/check_requirements_consistency.py

  mypy:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install mypy

      - name: Run mypy
        run: mypy src/
