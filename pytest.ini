[pytest]
markers =
    gpu: marks tests that require GPU/CUDA
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --import-mode=importlib

filterwarnings =
    # 以下均为 Lightning/torchmetrics 在测试环境下固有触发的警告（非项目代码缺陷），
    # 按消息匹配抑制并注明原因。类别省略以匹配 Warning 基类，避免 Lightning 子类
    # (PossibleUserWarning) 解析问题。
    # Lightning: 单元测试直接调用 hook（training_step/validation_step 等）而未经过 Trainer，
    # 因此 self.trainer 未注册，self.log() 触发此警告。这是测试方式固有行为。
    ignore:You are trying to `self.log\(\)` but the `self.trainer` reference is not registered
    # torchmetrics: 在退化的小型测试 fixture（单类/全正/全负样本）上，torchmetrics 固有地
    # 发出 nan/无意义分数警告。测试数据为故意构造的退化输入，非真实评估。
    ignore:No negative samples in targets
    ignore:No positive samples in targets
    ignore:Average precision score for one or more classes was `nan`
    # Lightning dataloader: 测试 fixture 故意设置 num_workers=0 以保证确定性，触发
    # "does not have many workers" 性能提示。非缺陷。
    ignore:does not have many workers
    # Lightning: 测试数据 batch 数小于默认 log_every_n_steps，触发 "training batches smaller
    # than the logging interval"。集成/e2e 路径由配置驱动难以注入 log_every_n_steps，为已知测试环境噪声。
    ignore:The number of training batches
    # Lightning: 测试环境（CPU）触发 "GPU available but not used"。非缺陷。
    ignore:GPU available but not used
    # Lightning model_summary: bf16-mixed 精度不支持 model summary，Lightning 内部回退到 32 位。非缺陷。
    ignore:Precision bf16-mixed is not supported by the model summary
    # Lightning: 测试调用 .test(ckpt_path=None) 时使用上一次 fit 的最佳模型，为预期行为。非缺陷。
    ignore:was called without a model
    # Lightning cloud_io: 加载可信测试 checkpoint 时 torch.load(weights_only=False) 触发安全警告。
    # 测试使用自生成的可信 checkpoint，非缺陷。
    ignore:You are using `torch.load` with `weights_only=False`
    # Lightning: 测试用临时 checkpoint 目录复用，触发 "Checkpoint directory exists and is not empty"。非缺陷。
    ignore:Checkpoint directory.*exists and is not empty
